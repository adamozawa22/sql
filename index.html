<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasa fiskalna</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }

    header {
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    main {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0001;
    }

    input, button, select {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      margin: 6px 0;
      border-radius: 7px;
      border: 1px solid #cbd5e1;
      font-size: 15px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .product {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #e2e8f0;
      padding: 10px 0;
    }

    .product button {
      width: auto;
      margin: 0;
    }

    .cart-row {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .total {
      font-size: 24px;
      font-weight: bold;
      margin-top: 20px;
      text-align: right;
    }

    .message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      background: #e0f2fe;
    }

    @media (max-width: 750px ) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Kasa fiskalna</h1>
    <div id="userInfo">Niezalogowany</div>
  </header>

  <main>
    <section>
      <h2>Logowanie</h2>

      <input id="email" type="email" placeholder="E-mail">
      <input id="password" type="password" placeholder="Hasło">

      <button onclick="login()">Zaloguj</button>
      <button onclick="register()">Utwórz konto</button>

      <div id="authMessage" class="message"></div>
    </section>

    <section>
      <h2>Dodaj produkt</h2>

      <input id="productName" placeholder="Nazwa produktu">
      <input id="productBarcode" placeholder="Kod kreskowy">
      <input id="productPrice" type="number" step="0.01" placeholder="Cena brutto">
      <input id="productVat" type="number" value="23" placeholder="VAT %">

      <button onclick="addProduct()">Dodaj produkt</button>
    </section>

    <section>
      <h2>Produkty</h2>

      <input
        id="search"
        placeholder="Szukaj produktu lub kodu..."
        oninput="filterProducts()"
      >

      <div id="products"></div>
    </section>

    <section>
      <h2>Paragon</h2>

      <div id="cart"></div>

      <div class="total">
        Razem: <span id="total">0.00</span> zł
      </div>

      <select id="paymentMethod">
        <option value="cash">Gotówka</option>
        <option value="card">Karta</option>
        <option value="transfer">Przelew</option>
      </select>

      <button onclick="completeSale()">Zakończ sprzedaż</button>
      <div id="saleMessage" class="message"></div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://kbmckegbihtnjggvxbnq.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_g3Ip7s1jBzSenb_UVG2P9A_kY8h0kCY";


    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    let allProducts = [];
    let cart = [];

    async function register() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { error } = await supabaseClient.auth.signUp({
        email,
        password
      });

      document.getElementById("authMessage").textContent =
        error ? error.message : "Konto utworzone. Sprawdź e-mail.";
    }

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      document.getElementById("authMessage").textContent =
        error ? error.message : "Zalogowano poprawnie.";

      if (!error) {
        document.getElementById("userInfo").textContent =
          "Zalogowany: " + data.user.email;

        loadProducts();
      }
    }

    async function addProduct() {
      const name = document.getElementById("productName").value;
      const barcode = document.getElementById("productBarcode").value;
      const price = Number(document.getElementById("productPrice").value);
      const vatRate = Number(document.getElementById("productVat").value);

      if (!name || !price) {
        alert("Podaj nazwę i cenę produktu.");
        return;
      }

      const { error } = await supabaseClient
        .from("products")
        .insert({
          name,
          barcode: barcode || null,
          price,
          vat_rate: vatRate
        });

      if (error) {
        alert(error.message);
        return;
      }

      document.getElementById("productName").value = "";
      document.getElementById("productBarcode").value = "";
      document.getElementById("productPrice").value = "";

      await loadProducts();
    }

    async function loadProducts() {
      const { data, error } = await supabaseClient
        .from("products")
        .select("*")
        .eq("active", true)
        .order("name");

      if (error) {
        alert(error.message);
        return;
      }

      allProducts = data || [];
      displayProducts(allProducts);
    }

    function displayProducts(products) {
      const container = document.getElementById("products");
      container.innerHTML = "";

      if (!products.length) {
        container.innerHTML = "<p>Brak produktów.</p>";
        return;
      }

      products.forEach(product => {
        const row = document.createElement("div");
        row.className = "product";

        row.innerHTML = `
          <div>
            <strong>${escapeHtml(product.name)}</strong>  

            <small>${product.barcode || "brak kodu"}</small>
          </div>
          <div>
            <strong>${Number(product.price).toFixed(2)} zł</strong>
            <button onclick="addToCart('${product.id}')">Dodaj</button>
          </div>
        `;

        container.appendChild(row);
      });
    }

    function filterProducts() {
      const search = document
        .getElementById("search")
        .value
        .toLowerCase();

      const filtered = allProducts.filter(product =>
        product.name.toLowerCase().includes(search) ||
        (product.barcode || "").toLowerCase().includes(search)
      );

      displayProducts(filtered);
    }

    function addToCart(productId) {
      const product = allProducts.find(item => item.id === productId);
      if (!product) return;

      const existing = cart.find(item => item.id === productId);

      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({
          id: product.id,
          name: product.name,
          price: Number(product.price),
          vat_rate: Number(product.vat_rate),
          quantity: 1
        });
      }

      displayCart();
    }

    function removeFromCart(productId) {
      cart = cart.filter(item => item.id !== productId);
      displayCart();
    }

    function displayCart() {
      const container = document.getElementById("cart");
      container.innerHTML = "";

      let total = 0;

      cart.forEach(item => {
        const lineTotal = item.price * item.quantity;
        total += lineTotal;

        const row = document.createElement("div");
        row.className = "cart-row";

        row.innerHTML = `
          <span>
            ${escapeHtml(item.name)} × ${item.quantity}
          </span>
          <span>
            ${lineTotal.toFixed(2)} zł
            <button
              style="width:auto;padding:5px 8px;background:#dc2626"
              onclick="removeFromCart('${item.id}')">
              Usuń
            </button>
          </span>
        `;

        container.appendChild(row);
      });

      document.getElementById("total").textContent = total.toFixed(2);
    }

    async function completeSale() {
      const userResult = await supabaseClient.auth.getUser();
      const user = userResult.data.user;

      if (!user) {
        alert("Najpierw się zaloguj.");
        return;
      }

      if (!cart.length) {
        alert("Paragon jest pusty.");
        return;
      }

      const total = cart.reduce(
        (sum, item) => sum + item.price * item.quantity,
        0
      );

      const receiptNumber =
        "PAR-" + Date.now();

      const paymentMethod =
        document.getElementById("paymentMethod").value;

      const { data: sale, error: saleError } =
        await supabaseClient
          .from("sales")
          .insert({
            user_id: user.id,
            receipt_number: receiptNumber,
            total,
            payment_method: paymentMethod
          })
          .select()
          .single();

      if (saleError) {
        alert(saleError.message);
        return;
      }

      const saleItems = cart.map(item => ({
        sale_id: sale.id,
        product_id: item.id,
        product_name: item.name,
        quantity: item.quantity,
        unit_price: item.price,
        vat_rate: item.vat_rate
      }));

      const { error: itemsError } =
        await supabaseClient
          .from("sale_items")
          .insert(saleItems);

      if (itemsError) {
        alert(itemsError.message);
        return;
      }

      document.getElementById("saleMessage").textContent =
        "Sprzedaż zapisana. Numer: " + receiptNumber;

      cart = [];
      displayCart();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    supabaseClient.auth.onAuthStateChange((_event, session) => {
      if (session?.user) {
        document.getElementById("userInfo").textContent =
          "Zalogowany: " + session.user.email;

        loadProducts();
      }
    });
  </script>
</body>
</html>
