<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lokalna kasa fiskalna</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }

    header {
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    main {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 15px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin-top: 0;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 11px;
      margin: 6px 0;
      border-radius: 7px;
      border: 1px solid #cbd5e1;
      font-size: 15px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button.secondary {
      background: #64748b;
    }

    button.secondary:hover {
      background: #475569;
    }

    button.danger {
      background: #dc2626;
    }

    button.danger:hover {
      background: #b91c1c;
    }

    button.small {
      width: auto;
      padding: 7px 10px;
      margin: 2px;
      font-size: 13px;
    }

    .product {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .product:last-child {
      border-bottom: none;
    }

    .product-info {
      flex: 1;
    }

    .product-actions {
      min-width: 130px;
      text-align: right;
    }

    .cart-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .cart-row:last-child {
      border-bottom: none;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .quantity-controls button {
      width: 30px;
      height: 30px;
      padding: 0;
      margin: 0;
    }

    .total {
      font-size: 25px;
      font-weight: bold;
      margin-top: 20px;
      text-align: right;
    }

    .message {
      min-height: 20px;
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      background: #e0f2fe;
      color: #075985;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .empty {
      color: #64748b;
    }

    .receipt {
      border: 1px dashed #94a3b8;
      padding: 15px;
      margin-top: 20px;
      background: #fff;
      font-family: monospace;
    }

    .receipt h3 {
      text-align: center;
      margin-top: 0;
    }

    .receipt-line {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 0;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 800px) {
      main {
        grid-template-columns: 1fr;
      }

      .cart-row {
        grid-template-columns: 1fr;
        gap: 5px;
      }

      .product {
        align-items: flex-start;
      }

      .product-actions {
        min-width: 100px;
      }
    }

    @media print {
      body * {
        visibility: hidden;
      }

      #receipt,
      #receipt * {
        visibility: visible;
      }

      #receipt {
        position: absolute;
        left: 0;
        top: 0;
        width: 80mm;
        border: none;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Lokalna kasa fiskalna</h1>
    <div>Tryb lokalny — dane są zapisane tylko w tej przeglądarce</div>
  </header>

  <main>
    <!-- Dodawanie produktu -->
    <section>
      <h2>Dodaj lub ustaw produkt</h2>

      <input
        id="productName"
        type="text"
        placeholder="Nazwa produktu na paragonie"
      >

      <input
        id="productPrice"
        type="number"
        min="0"
        step="0.01"
        placeholder="Cena brutto"
      >

      <input
        id="productBarcode"
        type="text"
        placeholder="Kod kreskowy — opcjonalnie"
      >

      <input
        id="productVat"
        type="number"
        min="0"
        value="23"
        placeholder="VAT %"
      >

      <button id="saveProductButton">
        Dodaj produkt
      </button>

      <button
        id="cancelEditButton"
        class="secondary hidden">
        Anuluj edycję
      </button>

      <div id="productMessage" class="message"></div>
    </section>

    <!-- Produkty -->
    <section>
      <h2>Produkty</h2>

      <input
        id="searchInput"
        type="text"
        placeholder="Szukaj po nazwie lub kodzie..."
      >

      <div id="productsList">
        <p class="empty">Nie dodano jeszcze produktów.</p>
      </div>
    </section>

    <!-- Paragon -->
    <section>
      <h2>Aktualny paragon</h2>

      <div id="cartList">
        <p class="empty">Paragon jest pusty.</p>
      </div>

      <div class="total">
        Razem:
        <span id="totalValue">0.00</span> zł
      </div>

      <select id="paymentMethod">
        <option value="Gotówka">Gotówka</option>
        <option value="Karta">Karta</option>
        <option value="Przelew">Przelew</option>
      </select>

      <button id="finishSaleButton">
        Zakończ sprzedaż
      </button>

      <button
        id="clearCartButton"
        class="danger">
        Wyczyść paragon
      </button>

      <div id="saleMessage" class="message"></div>
    </section>

    <!-- Ostatni paragon -->
    <section>
      <h2>Ostatni paragon</h2>

      <div id="receipt" class="receipt hidden"></div>

      <button
        id="printReceiptButton"
        class="secondary hidden">
        Drukuj paragon
      </button>
    </section>
  </main>

  <script>
    /*
      WERSJA LOKALNA

      Nie ma tu połączenia z Supabase ani żadnym backendem.
      Produkty są przechowywane w localStorage przeglądarki.
    */

    const PRODUCTS_KEY = "lokalna_kasa_produkty";
    const SALES_KEY = "lokalna_kasa_sprzedaz";

    let products = loadProducts();
    let cart = [];
    let editingProductId = null;
    let lastReceipt = null;

    const productNameInput =
      document.getElementById("productName");

    const productPriceInput =
      document.getElementById("productPrice");

    const productBarcodeInput =
      document.getElementById("productBarcode");

    const productVatInput =
      document.getElementById("productVat");

    const saveProductButton =
      document.getElementById("saveProductButton");

    const cancelEditButton =
      document.getElementById("cancelEditButton");

    const productMessage =
      document.getElementById("productMessage");

    const searchInput =
      document.getElementById("searchInput");

    const productsList =
      document.getElementById("productsList");

    const cartList =
      document.getElementById("cartList");

    const totalValue =
      document.getElementById("totalValue");

    const paymentMethod =
      document.getElementById("paymentMethod");

    const finishSaleButton =
      document.getElementById("finishSaleButton");

    const clearCartButton =
      document.getElementById("clearCartButton");

    const saleMessage =
      document.getElementById("saleMessage");

    const receipt =
      document.getElementById("receipt");

    const printReceiptButton =
      document.getElementById("printReceiptButton");

    function createId() {
      return Date.now().toString() +
        Math.random().toString(16).slice(2);
    }

    function loadProducts() {
      try {
        return JSON.parse(
          localStorage.getItem(PRODUCTS_KEY)
        ) || [];
      } catch {
        return [];
      }
    }

    function saveProducts() {
      localStorage.setItem(
        PRODUCTS_KEY,
        JSON.stringify(products)
      );
    }

    function showMessage(element, text, type = "") {
      element.textContent = text;
      element.className = "message " + type;
    }

    function clearMessage(element) {
      element.textContent = "";
      element.className = "message";
    }

    function money(value) {
      return Number(value || 0).toFixed(2);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderProducts() {
      const search = searchInput.value
        .trim()
        .toLowerCase();

      const filteredProducts = products.filter(product => {
        const name = product.name.toLowerCase();
        const barcode = product.barcode.toLowerCase();

        return (
          name.includes(search) ||
          barcode.includes(search)
        );
      });

      productsList.innerHTML = "";

      if (!filteredProducts.length) {
        productsList.innerHTML =
          '<p class="empty">Brak produktów.</p>';
        return;
      }

      filteredProducts.forEach(product => {
        const row = document.createElement("div");
        row.className = "product";

        row.innerHTML = `
          <div class="product-info">
            <strong>${escapeHtml(product.name)}</strong>  

            <span>
              Cena: ${money(product.price)} zł
            </span>  

            <small>
              Kod: ${escapeHtml(product.barcode || "brak")}
              | VAT: ${product.vat}% 
            </small>
          </div>

          <div class="product-actions">
            <button
              class="small"
              data-action="add">
              Dodaj
            </button>

            <button
              class="small secondary"
              data-action="edit">
              Edytuj
            </button>

            <button
              class="small danger"
              data-action="delete">
              Usuń
            </button>
          </div>
        `;

        row.querySelector('[data-action="add"]')
          .addEventListener("click", () => {
            addToCart(product.id);
          });

        row.querySelector('[data-action="edit"]')
          .addEventListener("click", () => {
            startEditProduct(product.id);
          });

        row.querySelector('[data-action="delete"]')
          .addEventListener("click", () => {
            deleteProduct(product.id);
          });

        productsList.appendChild(row);
      });
    }

    function saveProduct() {
      clearMessage(productMessage);

      const name = productNameInput.value.trim();
      const price = Number(productPriceInput.value);
      const barcode = productBarcodeInput.value.trim();
      const vat = Number(productVatInput.value);

      if (!name) {
        showMessage(
          productMessage,
          "Wpisz nazwę produktu.",
          "error"
        );
        return;
      }

      if (!Number.isFinite(price) || price < 0) {
        showMessage(
          productMessage,
          "Wpisz prawidłową cenę.",
          "error"
        );
        return;
      }

      if (!Number.isFinite(vat) || vat < 0) {
        showMessage(
          productMessage,
          "Wpisz prawidłową stawkę VAT.",
          "error"
        );
        return;
      }

      if (editingProductId) {
        const product = products.find(
          item => item.id === editingProductId
        );

        if (product) {
          product.name = name;
          product.price = price;
          product.barcode = barcode;
          product.vat = vat;
        }

        showMessage(
          productMessage,
          "Produkt został zaktualizowany.",
          "success"
        );
      } else {
        products.push({
          id: createId(),
          name,
          price,
          barcode,
          vat
        });

        showMessage(
          productMessage,
          "Produkt został dodany.",
          "success"
        );
      }

      saveProducts();
      clearProductForm();
      renderProducts();
    }

    function startEditProduct(productId) {
      const product = products.find(
        item => item.id === productId
      );

      if (!product) {
        return;
      }

      editingProductId = productId;

      productNameInput.value = product.name;
      productPriceInput.value = product.price;
      productBarcodeInput.value = product.barcode;
      productVatInput.value = product.vat;

      saveProductButton.textContent =
        "Zapisz zmiany produktu";

      cancelEditButton.classList.remove("hidden");

      productNameInput.focus();

      showMessage(
        productMessage,
        "Edytujesz produkt. Zmień nazwę lub cenę i zapisz.",
        ""
      );
    }

    function clearProductForm() {
      editingProductId = null;

      productNameInput.value = "";
      productPriceInput.value = "";
      productBarcodeInput.value = "";
      productVatInput.value = "23";

      saveProductButton.textContent =
        "Dodaj produkt";

      cancelEditButton.classList.add("hidden");
    }

    function deleteProduct(productId) {
      const product = products.find(
        item => item.id === productId
      );

      if (!product) {
        return;
      }

      const confirmed = confirm(
        `Usunąć produkt "${product.name}"?`
      );

      if (!confirmed) {
        return;
      }

      products = products.filter(
        item => item.id !== productId
      );

      saveProducts();
      renderProducts();

      showMessage(
        productMessage,
        "Produkt został usunięty.",
        "success"
      );
    }

    function addToCart(productId) {
      const product = products.find(
        item => item.id === productId
      );

      if (!product) {
        return;
      }

      /*
        Nazwa i cena są kopiowane do koszyka.
        Dzięki temu paragon zachowuje cenę i nazwę
        ustawione w chwili dodania produktu.
      */

      const existingItem = cart.find(
        item => item.productId === productId
      );

      if (existingItem) {
        existingItem.quantity += 1;
      } else {
        cart.push({
          productId: product.id,
          name: product.name,
          price: Number(product.price),
          vat: Number(product.vat),
          quantity: 1
        });
      }

      renderCart();

      showMessage(
        saleMessage,
        `${product.name} dodano na paragon.`,
        "success"
      );
    }

    function changeQuantity(productId, change) {
      const item = cart.find(
        cartItem => cartItem.productId === productId
      );

      if (!item) {
        return;
      }

      item.quantity += change;

      if (item.quantity <= 0) {
        cart = cart.filter(
          cartItem => cartItem.productId !== productId
        );
      }

      renderCart();
    }

    function removeFromCart(productId) {
      cart = cart.filter(
        item => item.productId !== productId
      );

      renderCart();
    }

    function calculateTotal() {
      return cart.reduce((total, item) => {
        return total + item.price * item.quantity;
      }, 0);
    }

    function renderCart() {
      cartList.innerHTML = "";

      if (!cart.length) {
        cartList.innerHTML =
          '<p class="empty">Paragon jest pusty.</p>';

        totalValue.textContent = "0.00";
        return;
      }

      cart.forEach(item => {
        const lineTotal =
          item.price * item.quantity;

        const row = document.createElement("div");
        row.className = "cart-row";

        row.innerHTML = `
          <div>
            <strong>${escapeHtml(item.name)}</strong>  

            <small>
              ${money(item.price)} zł/szt.
              | Razem: ${money(lineTotal)} zł
            </small>
          </div>

          <div class="quantity-controls">
            <button data-action="minus">−</button>
            <strong>${item.quantity}</strong>
            <button data-action="plus">+</button>
          </div>

          <button
            class="small danger"
            data-action="remove">
            Usuń
          </button>
        `;

        row.querySelector('[data-action="minus"]')
          .addEventListener("click", () => {
            changeQuantity(item.productId, -1);
          });

        row.querySelector('[data-action="plus"]')
          .addEventListener("click", () => {
            changeQuantity(item.productId, 1);
          });

        row.querySelector('[data-action="remove"]')
          .addEventListener("click", () => {
            removeFromCart(item.productId);
          });

        cartList.appendChild(row);
      });

      totalValue.textContent =
        money(calculateTotal());
    }

    function finishSale() {
      clearMessage(saleMessage);

      if (!cart.length) {
        showMessage(
          saleMessage,
          "Paragon jest pusty.",
          "error"
        );
        return;
      }

      const sale = {
        id: createId(),
        number: "PAR-" + Date.now(),
        date: new Date().toLocaleString("pl-PL"),
        payment: paymentMethod.value,
        items: cart.map(item => ({
          name: item.name,
          price: item.price,
          vat: item.vat,
          quantity: item.quantity
        })),
        total: calculateTotal()
      };

      const previousSales = JSON.parse(
        localStorage.getItem(SALES_KEY) || "[]"
      );

      previousSales.push(sale);

      localStorage.setItem(
        SALES_KEY,
        JSON.stringify(previousSales)
      );

      lastReceipt = sale;
      renderReceipt();

      cart = [];
      renderCart();

      showMessage(
        saleMessage,
        `Sprzedaż zapisana lokalnie. Numer: ${sale.number}`,
        "success"
      );
    }

    function renderReceipt() {
      if (!lastReceipt) {
        receipt.classList.add("hidden");
        printReceiptButton.classList.add("hidden");
        return;
      }

      receipt.classList.remove("hidden");
      printReceiptButton.classList.remove("hidden");

      let itemsHtml = "";

      lastReceipt.items.forEach(item => {
        const lineTotal =
          item.price * item.quantity;

        itemsHtml += `
          <div class="receipt-line">
            <span>
              ${escapeHtml(item.name)}
              x${item.quantity}
            </span>
            <span>${money(lineTotal)} zł</span>
          </div>
        `;
      });

      receipt.innerHTML = `
        <h3>PARAGON</h3>

        <div>Numer: ${lastReceipt.number}</div>
        <div>Data: ${lastReceipt.date}</div>
        <div>Płatność: ${escapeHtml(lastReceipt.payment)}</div>

        <hr>

        ${itemsHtml}

        <hr>

        <div class="receipt-line">
          <strong>RAZEM:</strong>
          <strong>${money(lastReceipt.total)} zł</strong>
        </div>

        <p style="text-align:center">
          Dziękujemy za zakupy
        </p>
      `;
    }

    saveProductButton.addEventListener(
      "click",
      saveProduct
    );

    cancelEditButton.addEventListener(
      "click",
      () => {
        clearProductForm();
        clearMessage(productMessage);
      }
    );

    searchInput.addEventListener(
      "input",
      renderProducts
    );

    finishSaleButton.addEventListener(
      "click",
      finishSale
    );

    clearCartButton.addEventListener(
      "click",
      () => {
        cart = [];
        renderCart();

        showMessage(
          saleMessage,
          "Paragon został wyczyszczony.",
          "success"
        );
      }
    );

    printReceiptButton.addEventListener(
      "click",
      () => {
        window.print();
      }
    );

    renderProducts();
    renderCart();
    renderReceipt();
  </script>
</body>
</html>
