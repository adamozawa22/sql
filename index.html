<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasa fiskalna</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }

    header {
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    main {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08 );
    }

    h2 {
      margin-top: 0;
    }

    input,
    button,
    select {
      width: 100%;
      padding: 11px;
      margin: 6px 0;
      border-radius: 7px;
      border: 1px solid #cbd5e1;
      font-size: 15px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button.danger {
      background: #dc2626;
      width: auto;
      padding: 6px 9px;
      margin: 0 0 0 8px;
    }

    button.danger:hover {
      background: #b91c1c;
    }

    .product {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #e2e8f0;
      padding: 10px 0;
    }

    .product:last-child {
      border-bottom: none;
    }

    .product button {
      width: auto;
      margin: 0;
      white-space: nowrap;
    }

    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .cart-row:last-child {
      border-bottom: none;
    }

    .total {
      font-size: 24px;
      font-weight: bold;
      margin-top: 20px;
      text-align: right;
    }

    .message {
      min-height: 20px;
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      background: #e0f2fe;
      color: #075985;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .empty {
      color: #64748b;
    }

    @media (max-width: 750px) {
      main {
        grid-template-columns: 1fr;
      }

      .product,
      .cart-row {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Kasa fiskalna</h1>
    <div id="userInfo">Niezalogowany</div>
  </header>

  <main>
    <!-- Logowanie -->
    <section>
      <h2>Logowanie</h2>

      <input
        id="email"
        type="email"
        placeholder="E-mail"
      >

      <input
        id="password"
        type="password"
        placeholder="Hasło"
      >

      <button id="loginButton">Zaloguj</button>
      <button id="registerButton">Utwórz konto</button>
      <button id="logoutButton" style="display: none; background: #64748b;">
        Wyloguj
      </button>

      <div id="authMessage" class="message"></div>
    </section>

    <!-- Dodawanie produktu -->
    <section>
      <h2>Dodaj produkt</h2>

      <input
        id="productName"
        placeholder="Nazwa produktu"
      >

      <input
        id="productBarcode"
        placeholder="Kod kreskowy"
      >

      <input
        id="productPrice"
        type="number"
        min="0"
        step="0.01"
        placeholder="Cena brutto"
      >

      <input
        id="productVat"
        type="number"
        min="0"
        value="23"
        placeholder="VAT %"
      >

      <button id="addProductButton">Dodaj produkt</button>
    </section>

    <!-- Lista produktów -->
    <section>
      <h2>Produkty</h2>

      <input
        id="search"
        placeholder="Szukaj produktu lub kodu..."
      >

      <div id="products">
        <p class="empty">Zaloguj się, aby zobaczyć produkty.</p>
      </div>
    </section>

    <!-- Koszyk i sprzedaż -->
    <section>
      <h2>Paragon</h2>

      <div id="cart">
        <p class="empty">Paragon jest pusty.</p>
      </div>

      <div class="total">
        Razem:
        <span id="total">0.00</span> zł
      </div>

      <select id="paymentMethod">
        <option value="cash">Gotówka</option>
        <option value="card">Karta</option>
        <option value="transfer">Przelew</option>
      </select>

      <button id="completeSaleButton">
        Zakończ sprzedaż
      </button>

      <div id="saleMessage" class="message"></div>
    </section>
  </main>

  <script>
    /*
      KONFIGURACJA SUPABASE

      Adres projektu oraz klucz publiczny.
      Nie wstawiaj tutaj klucza service_role.
    */

    const SUPABASE_URL =
      "https://kbmckegbhtnjggvvxnbq.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_g3Ip7s1jBzSenb_UVG2P9A_kY8h0kCY";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
     );

    let allProducts = [];
    let cart = [];

    const userInfo = document.getElementById("userInfo");
    const authMessage = document.getElementById("authMessage");
    const saleMessage = document.getElementById("saleMessage");
    const productsContainer = document.getElementById("products");
    const cartContainer = document.getElementById("cart");
    const totalElement = document.getElementById("total");

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    const productNameInput = document.getElementById("productName");
    const productBarcodeInput = document.getElementById("productBarcode");
    const productPriceInput = document.getElementById("productPrice");
    const productVatInput = document.getElementById("productVat");
    const searchInput = document.getElementById("search");

    const loginButton = document.getElementById("loginButton");
    const registerButton = document.getElementById("registerButton");
    const logoutButton = document.getElementById("logoutButton");
    const addProductButton = document.getElementById("addProductButton");
    const completeSaleButton = document.getElementById("completeSaleButton");
    const paymentMethodSelect = document.getElementById("paymentMethod");

    function showMessage(element, text, type = "") {
      element.textContent = text;
      element.className = "message " + type;
    }

    function clearMessage(element) {
      element.textContent = "";
      element.className = "message";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function register() {
      clearMessage(authMessage);

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showMessage(
          authMessage,
          "Podaj e-mail i hasło.",
          "error"
        );
        return;
      }

      if (password.length < 6) {
        showMessage(
          authMessage,
          "Hasło musi mieć co najmniej 6 znaków.",
          "error"
        );
        return;
      }

      const { error } = await supabaseClient.auth.signUp({
        email,
        password
      });

      if (error) {
        showMessage(authMessage, error.message, "error");
        return;
      }

      showMessage(
        authMessage,
        "Konto utworzone. Sprawdź skrzynkę e-mail, jeśli wymagana jest aktywacja.",
        "success"
      );
    }

    async function login() {
      clearMessage(authMessage);

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showMessage(
          authMessage,
          "Podaj e-mail i hasło.",
          "error"
        );
        return;
      }

      const { error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        showMessage(authMessage, error.message, "error");
        return;
      }

      showMessage(
        authMessage,
        "Zalogowano poprawnie.",
        "success"
      );

      await updateUserInterface();
      await loadProducts();
    }

    async function logout() {
      const { error } = await supabaseClient.auth.signOut();

      if (error) {
        showMessage(authMessage, error.message, "error");
        return;
      }

      userInfo.textContent = "Niezalogowany";
      logoutButton.style.display = "none";

      productsContainer.innerHTML =
        '<p class="empty">Zaloguj się, aby zobaczyć produkty.</p>';

      cart = [];
      displayCart();

      showMessage(
        authMessage,
        "Wylogowano.",
        "success"
      );
    }

    async function updateUserInterface() {
      const { data } = await supabaseClient.auth.getUser();
      const user = data.user;

      if (user) {
        userInfo.textContent = "Zalogowany: " + user.email;
        logoutButton.style.display = "block";
      } else {
        userInfo.textContent = "Niezalogowany";
        logoutButton.style.display = "none";
      }
    }

    async function addProduct() {
      clearMessage(authMessage);

      const { data } = await supabaseClient.auth.getUser();
      const user = data.user;

      if (!user) {
        showMessage(
          authMessage,
          "Najpierw się zaloguj.",
          "error"
        );
        return;
      }

      const name = productNameInput.value.trim();
      const barcode = productBarcodeInput.value.trim();
      const price = Number(productPriceInput.value);
      const vatRate = Number(productVatInput.value);

      if (!name) {
        showMessage(
          authMessage,
          "Podaj nazwę produktu.",
          "error"
        );
        return;
      }

      if (!Number.isFinite(price) || price < 0) {
        showMessage(
          authMessage,
          "Podaj prawidłową cenę.",
          "error"
        );
        return;
      }

      if (!Number.isFinite(vatRate) || vatRate < 0) {
        showMessage(
          authMessage,
          "Podaj prawidłową stawkę VAT.",
          "error"
        );
        return;
      }

      const { error } = await supabaseClient
        .from("products")
        .insert({
          name: name,
          barcode: barcode || null,
          price: price,
          vat_rate: vatRate
        });

      if (error) {
        showMessage(authMessage, error.message, "error");
        return;
      }

      productNameInput.value = "";
      productBarcodeInput.value = "";
      productPriceInput.value = "";
      productVatInput.value = "23";

      showMessage(
        authMessage,
        "Produkt został dodany.",
        "success"
      );

      await loadProducts();
    }

    async function loadProducts() {
      const { data: userData } =
        await supabaseClient.auth.getUser();

      if (!userData.user) {
        return;
      }

      const { data, error } = await supabaseClient
        .from("products")
        .select("*")
        .eq("active", true)
        .order("name", { ascending: true });

      if (error) {
        productsContainer.innerHTML = "";
        showMessage(
          authMessage,
          "Nie można pobrać produktów: " + error.message,
          "error"
        );
        return;
      }

      allProducts = data || [];
      displayProducts(allProducts);
    }

    function displayProducts(products) {
      productsContainer.innerHTML = "";

      if (!products.length) {
        productsContainer.innerHTML =
          '<p class="empty">Brak produktów.</p>';
        return;
      }

      products.forEach(product => {
        const row = document.createElement("div");
        row.className = "product";

        const price = Number(product.price || 0).toFixed(2);

        row.innerHTML = `
          <div>
            <strong>${escapeHtml(product.name)}</strong>  

            <small>
              Kod: ${escapeHtml(product.barcode || "brak")}
            </small>
          </div>

          <div>
            <strong>${price} zł</strong>
            <button
              type="button"
              data-product-id="${escapeHtml(product.id)}">
              Dodaj
            </button>
          </div>
        `;

        const addButton = row.querySelector("button");

        addButton.addEventListener("click", () => {
          addToCart(product.id);
        });

        productsContainer.appendChild(row);
      });
    }

    function filterProducts() {
      const search = searchInput.value.trim().toLowerCase();

      const filtered = allProducts.filter(product => {
        const name = String(product.name || "").toLowerCase();
        const barcode = String(product.barcode || "").toLowerCase();

        return name.includes(search) || barcode.includes(search);
      });

      displayProducts(filtered);
    }

    function addToCart(productId) {
      const product = allProducts.find(
        item => item.id === productId
      );

      if (!product) {
        return;
      }

      const existing = cart.find(
        item => item.id === productId
      );

      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({
          id: product.id,
          name: product.name,
          price: Number(product.price || 0),
          vat_rate: Number(product.vat_rate || 23),
          quantity: 1
        });
      }

      displayCart();
    }

    function removeFromCart(productId) {
      cart = cart.filter(
        item => item.id !== productId
      );

      displayCart();
    }

    function changeQuantity(productId, amount) {
      const item = cart.find(
        cartItem => cartItem.id === productId
      );

      if (!item) {
        return;
      }

      item.quantity += amount;

      if (item.quantity <= 0) {
        removeFromCart(productId);
        return;
      }

      displayCart();
    }

    function displayCart() {
      cartContainer.innerHTML = "";

      if (!cart.length) {
        cartContainer.innerHTML =
          '<p class="empty">Paragon jest pusty.</p>';
        totalElement.textContent = "0.00";
        return;
      }

      let total = 0;

      cart.forEach(item => {
        const lineTotal = item.price * item.quantity;
        total += lineTotal;

        const row = document.createElement("div");
        row.className = "cart-row";

        row.innerHTML = `
          <span>
            ${escapeHtml(item.name)}
            × ${item.quantity}
              

            <small>${item.price.toFixed(2)} zł/szt.</small>
          </span>

          <span>
            <strong>${lineTotal.toFixed(2)} zł</strong>
            <button
              type="button"
              class="danger">
              Usuń
            </button>
          </span>
        `;

        const removeButton = row.querySelector(".danger");

        removeButton.addEventListener("click", () => {
          removeFromCart(item.id);
        });

        row.addEventListener("dblclick", () => {
          changeQuantity(item.id, 1);
        });

        cartContainer.appendChild(row);
      });

      totalElement.textContent = total.toFixed(2);
    }

    async function completeSale() {
      clearMessage(saleMessage);

      const { data: userData } =
        await supabaseClient.auth.getUser();

      const user = userData.user;

      if (!user) {
        showMessage(
          saleMessage,
          "Najpierw się zaloguj.",
          "error"
        );
        return;
      }

      if (!cart.length) {
        showMessage(
          saleMessage,
          "Paragon jest pusty.",
          "error"
        );
        return;
      }

      const total = cart.reduce((sum, item) => {
        return sum + item.price * item.quantity;
      }, 0);

      const receiptNumber =
        "PAR-" +
        new Date().getTime();

      const paymentMethod =
        paymentMethodSelect.value;

      const { data: sale, error: saleError } =
        await supabaseClient
          .from("sales")
          .insert({
            user_id: user.id,
            receipt_number: receiptNumber,
            total: Number(total.toFixed(2)),
            payment_method: paymentMethod,
            status: "completed"
          })
          .select()
          .single();

      if (saleError) {
        showMessage(
          saleMessage,
          "Nie udało się zapisać sprzedaży: " +
            saleError.message,
          "error"
        );
        return;
      }

      const saleItems = cart.map(item => ({
        sale_id: sale.id,
        product_id: item.id,
        product_name: item.name,
        quantity: item.quantity,
        unit_price: item.price,
        vat_rate: item.vat_rate
      }));

      const { error: itemsError } =
        await supabaseClient
          .from("sale_items")
          .insert(saleItems);

      if (itemsError) {
        showMessage(
          saleMessage,
          "Sprzedaż utworzona, ale nie zapisano pozycji: " +
            itemsError.message,
          "error"
        );
        return;
      }

      showMessage(
        saleMessage,
        "Sprzedaż zapisana. Numer paragonu: " +
          receiptNumber,
        "success"
      );

      cart = [];
      displayCart();
    }

    loginButton.addEventListener("click", login);
    registerButton.addEventListener("click", register);
    logoutButton.addEventListener("click", logout);
    addProductButton.addEventListener("click", addProduct);
    completeSaleButton.addEventListener("click", completeSale);
    searchInput.addEventListener("input", filterProducts);

    supabaseClient.auth.onAuthStateChange(
      async (_event, session) => {
        if (session && session.user) {
          userInfo.textContent =
            "Zalogowany: " + session.user.email;

          logoutButton.style.display = "block";
          await loadProducts();
        } else {
          userInfo.textContent = "Niezalogowany";
          logoutButton.style.display = "none";
        }
      }
    );

    updateUserInterface();
    displayCart();
  </script>
</body>
</html>
